<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produse populare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <h1 id="titlu-principal" class="text-center text-primary my-4">Produse populare</h1>

    <div id="container-produse" class="d-flex flex-wrap justify-content-center align-items-stretch gap-3 p-3 bg-primary-subtle rounded-4 mx-auto" style="max-width: 800px;">

        <div id="card-laptop" class="bg-white rounded-3 border p-3 text-center" style="width: 200px;">
            <img class="w-100" style="height: 120px;" src="imagini/laptop.svg" alt="Laptop">
            <h2 class="fs-6 mt-2">Laptop</h2>
            <p class="text-success fw-semibold" style="font-size: 15px;">4 500 lei</p>
            <button class="btn btn-primary btn-sm rounded-pill px-3">Cumpara</button>
        </div>

        <div id="card-casti" class="bg-white rounded-3 border p-3 text-center" style="width: 200px;">
            <img class="w-100" style="height: 120px;" src="imagini/casti.svg" alt="Casti">
            <h2 class="fs-6 mt-2">Casti</h2>
            <p class="text-success fw-semibold" style="font-size: 15px;">350 lei</p>
            <button class="btn btn-primary btn-sm rounded-pill px-3">Cumpara</button>
        </div>

        <div id="card-telefon" class="bg-white rounded-3 border p-3 text-center" style="width: 200px;">
            <img class="w-100" style="height: 120px;" src="imagini/telefon.svg" alt="Telefon">
            <h2 class="fs-6 mt-2">Telefon</h2>
            <p class="text-success fw-semibold" style="font-size: 15px;">1 400 lei</p>
            <button class="btn btn-primary btn-sm rounded-pill px-3">Cumpara</button>
        </div>

    </div>

</body>
</html>
